<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game El Pollo Locco</title>
    <!-- Bootstrap Code -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />

    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
      integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
      integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
      crossorigin="anonymous"
    ></script>

    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="styles.css" />
    <script src="modules/drawableObject.classes.js"></script>
    <script src="modules/classes.movable.Ojects.js"></script>
    <script src="modules/classes.cloud.js"></script>
    <script src="modules/statusbar.classes.js"></script>
    <script src="modules/bottles.classes.js"></script>
    <script src="modules/statusbarBottle.js"></script>
    <script src="modules/classes.coins.js"></script>
    <script src="modules/coinBars.classes.js"></script>
    <script src="modules/classes.world.js"></script>
    <script src="modules/classes.chicken.js"></script>
    <script src="modules/class.smallChicken.js"></script>
    <script src="modules/keybaord.classes.js"></script>
    <script src="modules/classes.level.js"></script>
    <script src="modules/classes.background.js"></script>
    <script src="modules/classes.charachter.js"></script>
    <script src="modules/throwableObjects.classes.js"></script>
    <script src="modules/class.endBoss.js"></script>
    <script src="modules/sound.classes.js"></script>
    <script src="levels/level.js"></script>
    <script src="js/game.js"></script>
    <script src="js/mobile.control.js"></script>
  </head>
  <body onload="init()">
    <header>
      <div class="allcover" id="llcover">
        <h1>El Pollo Locco</h1>

        <div class="game-window">
          <img src="img/9_intro_outro_screens/start/startscreen_1.png" alt="" />
        </div>

        <div class="button-row">
          <button onclick="startGame()">START</button>
          <button>USER STORY</button>
          <button>HOW TO USE</button>
        </div>
      </div>
    </header>

    <!-- Restart Button über allem -->
    <div id="restartBtn" style="display: none; position: absolute; top: 20px; left: 0; width: 100%; z-index: 300" onclick="restartGame()">
      <img src="img/9_intro_outro_screens/game_over/game over!.png" alt="" class="coverCard" />
      <p class="coverCard retext"><img src="img/restart.png" alt="" class="restarImg" /></p>
    </div>

    <div id="game_over"></div>

    <!--   <div class="canvas-wrapper"> -->
    <canvas class="canvas" id="canvas" width="720" height="480" style="display: none"></canvas>
    <!--    </div> -->
    <div id="soundMute" onclick="toggleMute()" class="fullscreen-muttBnt" style="display: none">
      <img id="muteIcon" src="img/volume.png" width="24" alt="" width="28" />
      <div onclick="openFullscreen()"><img class="fullscreen" src="img/fullscreen.png" alt="" width="28" /></div>
    </div>

    <div class="mobile_hidden" id="mobile_hidden">
      <img id="btn-left" class="btn-arrow-left" src="img/right-arrow (2).png" alt="" />
      <img id="btn-right" class="btn-arrow-right" src="img/left runing.png" alt="" />
      <img id="btn-space" class="btn-arrow-jump" src="img/arrow-up.png" alt="" />
      <img id="btn-bottle" class="btn-arrow-bottle" src="img/throwSybol.png" alt="" />
    </div>
  </body>
</html>
