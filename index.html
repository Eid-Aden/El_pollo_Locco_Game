    <header>
      <h1>El Pollo Locco</h1>

    <div id="soundMute" onclick="toggleMute()">

    <button onclick="openFullscreen()">Vollbild</button>

    <!--  <h1 id="gameOver"></h1> -->
    <h2 id="lost"></h2>
    <canvas id="canvas" width="720" height="480"> </canvas>
    <b id="hurt"></b>

    <img id="youWin" class="youWin" src="img/9_intro_outro_screens/game_over/game over!.png" alt="" style="display: none" />

    <div class="overlay" id="overlay">
      <img id="startImg" class="startImg" src="img/9_intro_outro_screens/start/startscreen_1.png" alt="" />

      <div class="con_Container">
        <button class="start_BTN" id="start_BTN" onclick="startGame()">Start</button>
        <button class="cantrol" id=" control_BTN">Control</button>

        <button id="impres_BTN" class="impres_BTN">Impresseum</button>

    <footer>
